[project]
name = "kvcache-observability"
version = "0.1.0"
description = "Evidence-aware inference control plane for vLLM and SGLang"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kavora contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "matplotlib>=3.10.0",
  "prometheus-client>=0.20.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "uvicorn>=0.30.0",
  "pyyaml>=6.0.0",
  "msgspec>=0.19.0",
  "pyzmq>=27.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
offline = ["huggingface_hub>=0.24.0"]
vllm-hash = ["vllm>=0.11.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "exporter",
  "exporter.adapters",
  "exporter.derive",
  "exporter.registry",
  "benchmark",
  "planner",
  "engine_events",
]
