syntax = "proto3";
package kavora.tool.v1;
option go_package = "github.com/BokaiGuo-Lincoln/kavora/proto/gen/go/tool/v1;toolv1";

message ToolManifest {
  string name = 1;
  string version = 2;
  string sha256 = 3;
  string input_schema_json = 4;
  string output_schema_json = 5;
  repeated string capabilities = 6;
  uint64 timeout_millis = 7;
  uint64 memory_bytes = 8;
}

message ToolExecution {
  string tool_name = 1;
  string manifest_sha256 = 2;
  string input_json = 3;
  string request_id = 4;
}
