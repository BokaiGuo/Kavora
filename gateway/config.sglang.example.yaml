tenants:
  - id: sglang-local
    api_keys: [replace-with-sglang-key]
    max_concurrent: 4
    token_budget: 8192
    policy_fail_mode: closed
    ttft_slo_ms: 200
    routing_requirements:
      trust_zone: local

backends:
  - id: sglang-local
    url: http://127.0.0.1:30000
    enabled: true
    weight: 1
    models: [kvcache-local-tiny]
    health_path: /health
    attributes:
      trust_zone: local
      local_only: "true"
      accelerator: cuda
