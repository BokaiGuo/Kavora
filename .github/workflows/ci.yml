name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: policy-engine
      - name: Install protobuf toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          cargo install --locked protoc-gen-prost --version 0.5.0
          cargo install --locked protoc-gen-tonic --version 0.5.0
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format and protobuf consistency
        run: make fmt proto-check
      - name: Test all languages
        run: make test
      - name: Validate capacity-sweep artifact contract
        run: |
          tmpdir=$(mktemp -d)
          python - "$tmpdir" <<'PY'
          import json
          import sys
          from pathlib import Path
          from PIL import Image

          output = Path(sys.argv[1])
          output.mkdir(parents=True, exist_ok=True)
          document = {
              "meta": {
                  "experiment_schema_version": 3,
                  "run_entry_schema_version": 2,
                  "scenarios": ["ci"],
                  "concurrency_values": [1],
                  "repeats": 1,
              },
              "points": [{
                  "scenario": "ci",
                  "concurrency": 1,
                  "runs": [{"repeat": 1}],
                  "aggregates": {"quality_summary": {"metric_quality": "ok"}},
                  "recommendation": {},
                  "ranking": {},
              }],
              "ranking": {"by_scenario": {"ci": {}}},
          }
          (output / "summary.json").write_text(json.dumps(document), encoding="utf-8")
          (output / "summary.md").write_text(
              "## Ranking Plot\n\n![plot](capacity_sweep_ranking.png)\n",
              encoding="utf-8",
          )
          Image.new("RGB", (2, 2), "white").save(output / "capacity_sweep_ranking.png")
          PY
          python scripts/check_capacity_sweep_artifact.py "$tmpdir"
      - name: Race, vet, and clippy
        run: |
          go test -race ./...
          go vet ./...
          cargo clippy --manifest-path policy-engine/Cargo.toml --all-targets -- -D warnings
      - name: Cross-language integration
        run: make test-e2e-unary
      - name: Build binaries
        run: make build
